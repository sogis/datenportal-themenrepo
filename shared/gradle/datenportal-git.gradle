import javax.inject.Inject
import org.gradle.process.ExecOperations
import groovy.json.JsonOutput

// Die Git-CLI ist in der Jenkins-Laufzeit vorhanden. ExecOperations bindet ihre
// Aufrufe in Gradle ein; eine zusätzliche JGit-Abhängigkeit ist dafür nicht nötig.
// Argumente werden als Liste übergeben, damit Dateipfade und Commit-Identität nicht
// von einer Shell interpretiert werden. Credentials kommen aus der Laufzeitumgebung.
abstract class DatenportalGitCommands {
    @Inject abstract ExecOperations getExecOperations()
    Map run(File directory, List<String> arguments, boolean allowDifference=false) {
        def output=new ByteArrayOutputStream()
        def result=execOperations.exec {
            workingDir directory
            commandLine(['git']+arguments)
            // Ein unbeaufsichtigter Job darf bei fehlenden Credentials nicht auf
            // eine interaktive Eingabe warten, sondern muss mit einem Fehler enden.
            environment 'GIT_TERMINAL_PROMPT','0'
            standardOutput output; errorOutput output
            ignoreExitValue true
        }
        // git diff meldet gefundene Unterschiede mit Exitcode 1. Nur bei den dafür
        // vorgesehenen Vergleichsaufrufen ist das ein Ergebnis und kein Prozessfehler.
        if (result.exitValue!=0 && !(allowDifference && result.exitValue==1)) {
            throw new GradleException('Git operation failed: '+arguments[0]+' (exit '+result.exitValue+')\n'+output.toString('UTF-8'))
        }
        [code:result.exitValue,text:output.toString('UTF-8')]
    }
}
def git=objects.newInstance(DatenportalGitCommands)
def root=project.ext.publicationRoot
def work=project.ext.publicationWorkDir
def outputs=new File(work,'outputs')
def report=project.ext.publicationReport
def bootstrap=project.ext.has('datenportalBootstrap') && project.ext.datenportalBootstrap
def ctx=project.ext.datenportalContext
// Die erlaubte Zieldatei stammt aus der Themenauswahl, nicht aus einem frei
// übermittelten Uploadnamen. Automatisch zurückgeschrieben wird ausschliesslich
// dieses Datenblatt unter seinem bisherigen Repository-Pfad; Gesamt-XTF liegen in S3.
def targetRelative=ctx.selectedDatasetDef?.metadataFile ? root.toPath().relativize(ctx.selectedDatasetDef.metadataFile.toPath()).toString() : ''
def candidateSheet=new File(outputs,'metadata/'+(ctx.selectedDatasetDef?.metadataFile?.name ?: 'datasheet.xtf'))
def propertyText={ String name -> (findProperty(name) ?: '').toString().trim() }
// Git braucht zusätzlich zur Publikationsfreigabe einen eigenen ausdrücklichen
// Schalter. Ohne Repository-Modus gilt vorsichtshalber working-tree, sodass ein
// direkter lokaler Aufruf nicht versehentlich den Entwicklungsstand zurückschreibt.
def requestedWrite=propertyText('gitWriteBack')=='true' && project.ext.publicationWriteEnabled
def repositoryMode=propertyText('topicRepositoryMode') ?: 'working-tree'
report.baseRevision=propertyText('gitBaseRevision') ?: null
report.resultRevision=null
tasks.register('createPublicationDiff') {
    dependsOn 'validatePublication'
    doLast {
        def compare = { File original, File candidate ->
            // --no-index vergleicht auch Dateien ausserhalb des Git-Index. So gibt es
            // bereits in der Vorschau einen prüfbaren Diff, ohne den Checkout zu ändern.
            // /dev/null bildet beim Erstaufbau eine noch nicht vorhandene Datei ab.
            git.run(root,['diff','--no-index','--',original.isFile() ? original.path : '/dev/null',
                candidate.isFile() ? candidate.path : '/dev/null'],true).text
        }
        new File(outputs,'metadata.patch').text = bootstrap ? '' :
            compare(new File(root,targetRelative),candidateSheet)
        new File(outputs,'publication.patch').text =
            compare(new File(work,'input/previous-datasheets.xtf'),new File(outputs,'datasheets.xtf')) +
            compare(new File(work,'input/previous-catalog.xtf'),new File(outputs,'published-catalog.xtf'))
    }
}
tasks.register('commitAndPushMetadata') {
    doLast {
        def changes=bootstrap ? [:] : [(targetRelative):candidateSheet]
        if (repositoryMode=='working-tree' && requestedWrite) throw new GradleException('Git write-back is forbidden in working-tree mode.')
        if (requestedWrite) {
            // Den Fehlerstatus vor den Git-Aufrufen festhalten: Bei einem Abbruch
            // muss der gemeinsame Abschlussbericht erkennen lassen, dass das angeforderte
            // Rückschreiben nicht erfolgreich abgeschlossen wurde.
            report.git='failed'
            project.ext.writePublicationReport()
            if (repositoryMode!='managed-git') throw new GradleException('Git write-back requires managed-git mode.')
            def branch=propertyText('topicRepositoryBranch')
            def remote=propertyText('topicRepositoryUrl')
            def baseline=propertyText('gitBaseRevision')
            def authorName=propertyText('gitCommitterName')
            def authorEmail=propertyText('gitCommitterEmail')
            if (![branch,remote,baseline,authorName,authorEmail].every { it }) throw new GradleException('Git write-back context is incomplete.')
            if (System.getenv('JENKINS_RUNTIME_MODE')=='dev' && !remote.startsWith('file://')) throw new GradleException('Dev runtime may only push to a local test repository.')
            def remoteUri=new URI(remote)
            if (!(remoteUri.scheme in ['https','file']) || remoteUri.userInfo!=null) throw new GradleException('Git remote must use HTTPS or file without embedded credentials.')
            // Vor jeder Dateiänderung den von Jenkins übergebenen Kontext mit dem
            // tatsächlichen Checkout abgleichen. Ein anderer Branch, Remote oder
            // fremde lokale Änderungen dürfen nicht Teil des automatischen Commits werden.
            git.run(root,['check-ref-format','--branch',branch])
            if (git.run(root,['status','--porcelain']).text.trim()) throw new GradleException('Git checkout is not clean.')
            if (git.run(root,['rev-parse','HEAD']).text.trim()!=baseline) throw new GradleException('Unexpected Git baseline revision.')
            if (git.run(root,['remote','get-url','origin']).text.trim()!=remote || git.run(root,['remote','get-url','--push','origin']).text.trim()!=remote)
                throw new GradleException('Unexpected Git remote.')
            def currentBranch=git.run(root,['symbolic-ref','--short','HEAD']).text.trim()
            if (currentBranch!=branch) throw new GradleException('Unexpected Git branch.')
            // Die Jenkins-Sperre verhindert keine manuellen Git-Commits. Deshalb den
            // Remote-Stand nochmals prüfen. Eine spätere konkurrierende Änderung sichert
            // der normale Push durch Ablehnung ab; es gibt kein Force-Push oder Rebase.
            def remoteHead=git.run(root,['ls-remote','--exit-code','origin','refs/heads/'+branch]).text.tokenize()[0]
            if (remoteHead!=baseline) throw new GradleException('Remote changed during preparation; retry on the new revision.')
            // Erst nach allen Kontextprüfungen den validierten Export übernehmen.
            // Die kanonische Pfadprüfung berücksichtigt auch symbolische Verknüpfungen.
            changes.each { relative,candidate ->
                File destination=new File(root,relative)
                if (!destination.canonicalPath.startsWith(root.canonicalPath+File.separator)) throw new GradleException('Git target escapes checkout.')
                destination.parentFile.mkdirs()
                destination.bytes=candidate.bytes
            }
            // Explizite Pfade statt «git add .» verhindern, dass Build-Artefakte oder
            // andere Metadaten mitgestaged werden. Die anschliessende Indexprüfung
            // kontrolliert diese Begrenzung unmittelbar vor dem Commit nochmals.
            git.run(root,['add','--']+changes.keySet().toList())
            def staged=git.run(root,['diff','--cached','--name-only','-z']).text.split('\u0000').findAll { it }
            if (!changes.keySet().containsAll(staged)) throw new GradleException('Unexpected files staged for commit.')
            report.baseRevision=baseline
            if (staged) {
                git.run(root,['diff','--cached','--check'])
                // Die Nachricht enthält den Buildbezug für die Nachvollziehbarkeit.
                // Eine Datei bewahrt Zeilenumbrüche; -c setzt die technische Identität
                // nur für diesen Aufruf und verändert keine globale Git-Konfiguration.
                File message=new File(work,'commit-message.txt')
                message.text="data: ${report.dataset}"+(report.issue ? " / ${report.issue}" : '')+'\n\n'+
                    'Delivery: '+(System.getenv('BUILD_TAG') ?: 'local')+'\nBuild: '+(System.getenv('BUILD_URL') ?: 'local')+'\n'
                git.run(root,['-c','user.name='+authorName,'-c','user.email='+authorEmail,'commit','--file',message.path])
                git.run(root,['push','origin','HEAD:refs/heads/'+branch])
            }
            // Ohne Diff ist kein leerer Commit nötig. Auch dann ist der Git-Schritt
            // erfolgreich: Die geprüfte Revision bleibt unverändert. «pushed» bezeichnet
            // hier den abgeschlossenen Git-Schritt, nicht zwingend einen neuen Commit.
            report.resultRevision=git.run(root,['rev-parse','HEAD']).text.trim()
            report.git='pushed'
        }
        new File(outputs,'report.json').text=JsonOutput.prettyPrint(JsonOutput.toJson(report))+'\n'
    }
}
