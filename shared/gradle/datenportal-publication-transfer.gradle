import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.time.Duration
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

def p = project.ext.datenportalPublication
def bootstrap = p.bootstrap
def publish = (findProperty('s3Publish') ?: 'false').toString() == 'true'
def manifestUrl = (findProperty('publicationManifestUrl') ?: '').toString().trim()
def localInput = manifestUrl.startsWith('file:')
def inputManifest = new File(p.workDir, 'input/current.json')
def report = p.report
p.publish = publish
p.manifestUrl = manifestUrl
p.releaseId = UUID.randomUUID().toString()
p.releaseDir = new File(p.workDir,'release')
p.inputManifest = inputManifest
report.releaseId = p.releaseId
report.publicationMode = project.ext.datenportalContext.publicationMode
report.git = 'not-requested'
report.publication = 'not-published'
report.reload = 'not-requested'

def validateManifest = { Object value ->
    if (!(value instanceof Map) || value.schemaVersion != 1 || !(value.releaseId instanceof String)
        || !(value.releaseId ==~ /[A-Za-z0-9][A-Za-z0-9_-]{0,127}/)
        || value.datasheets != "datasheets-${value.releaseId}.xtf"
        || !value.containsKey('catalog')
        || !(value.catalog == null || value.catalog == "published-catalog-${value.releaseId}.xtf"))
        throw new GradleException('Invalid publication manifest (schemaVersion, releaseId or filenames).')
    value
}
project.ext.validatePublicationManifest = validateManifest
project.ext.writePublicationReport = {
    p.outputs.mkdirs()
    new File(p.outputs, 'report.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(report))+'\n'
}
// Used for bootstrap existence checks and resolving an uncertain final PUT, not file downloads.
project.ext.readPublicationPointer = {
    def uri = URI.create(manifestUrl)
    if (uri.scheme == 'file') {
        def f = new File(uri)
        return f.exists() ? [status:200, body:f.getText('UTF-8')] : [status:404, body:'']
    }
    def client = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(10)).build()
    def request = HttpRequest.newBuilder(uri).timeout(Duration.ofSeconds(30))
        .header('Cache-Control','no-cache, no-store').GET().build()
    def response = client.send(request,HttpResponse.BodyHandlers.ofString())
    [status:response.statusCode(),body:response.body()]
}
def preflight = tasks.register('checkPublicationSource') {
    dependsOn project.ext.publicationInputDependency
    doLast {
        if (!manifestUrl) throw new GradleException('publicationManifestUrl is required.')
        def uri = URI.create(manifestUrl)
        if (!(uri.scheme in ['http','https']) && !(uri.scheme=='file' && !publish))
            throw new GradleException('Manifest must use HTTP(S); file inputs are only allowed for offline previews.')
        if (uri.userInfo || uri.query || uri.fragment) throw new GradleException('Manifest URL must not contain credentials, query or fragment.')
        if (!localInput && gradle.startParameter.offline) throw new GradleException('HTTP publication downloads require omitting --offline; the configured offline dependency bundle remains in use.')
        if (publish) project.ext.requireDatenportalS3()
        if (publish && (findProperty('reloadPortal') ?: 'false').toString()=='true'
            && (!(findProperty('portalReloadUrl') ?: '').toString().trim() || !(findProperty('portalReloadToken') ?: '').toString()))
            throw new GradleException('Requested reload requires portalReloadUrl and portalReloadToken.')
        if (findProperty('initialCatalog') && (!bootstrap || !file(findProperty('initialCatalog')).isFile()))
            throw new GradleException('initialCatalog must be a readable file and is only allowed during initialization.')
        if (bootstrap && p.bootstrapFiles.isEmpty()) throw new GradleException('No repository datasheets for initialization.')
        if (bootstrap) {
            def response = project.ext.readPublicationPointer()
            if (response.status != 404) throw new GradleException("Initialization requires an absent current.json (HTTP 404); got ${response.status}.")
        }
    }
}
def downloadType = project.buildscript.classLoader.loadClass('de.undercouch.gradle.tasks.download.Download')
def downloadCurrent = tasks.register('downloadCurrent',downloadType) {
    dependsOn preflight
    src manifestUrl ?: 'http://invalid.invalid/current.json'
    dest inputManifest
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'
    header 'Cache-Control','no-cache, no-store'
    outputs.upToDateWhen { false }
    setOnlyIf { !bootstrap && !localInput }
}
def localCurrent = tasks.register('copyCurrentManifest',Copy) {
    dependsOn preflight
    into inputManifest.parentFile
    from { localInput ? new File(URI.create(manifestUrl)) : [] }
    rename { 'current.json' }
    onlyIf { !bootstrap && localInput }
    doFirst { if (!new File(URI.create(manifestUrl)).isFile()) throw new GradleException('Missing current.json; initialize explicitly.') }
}
def parseCurrent = tasks.register('readCurrentManifest') {
    dependsOn downloadCurrent,localCurrent
    doLast {
        if (!bootstrap) {
            p.current = validateManifest(new JsonSlurper().parse(inputManifest))
            report.sourceReleaseId = p.current.releaseId
        }
    }
}
def downloads = []
['datasheets':p.previousSheets, 'catalog':p.previousFile].each { key, destination ->
    downloads << tasks.register('downloadPrevious'+key.capitalize(),downloadType) {
        dependsOn parseCurrent
        src { p.current?.get(key) ? URI.create(manifestUrl).resolve(p.current[key].toString()).toString() : [] }
        dest destination
        overwrite true; tempAndMove true; compress false
        header 'Accept-Encoding','identity'
        outputs.upToDateWhen { false }
        setOnlyIf { !bootstrap && !localInput && p.current[key] != null }
    }
    downloads << tasks.register('copyPrevious'+key.capitalize(),Copy) {
        dependsOn parseCurrent
        into destination.parentFile
        from { !bootstrap && localInput && p.current && p.current[key] != null ? new File(URI.create(manifestUrl).resolve(p.current[key].toString())) : [] }
        rename { destination.name }
        onlyIf { !bootstrap && localInput && p.current[key] != null }
        doFirst { if (!new File(URI.create(manifestUrl).resolve(p.current[key].toString())).isFile()) throw new GradleException('Missing referenced '+key) }
    }
}
def copyInitial = tasks.register('copyInitialCatalog',Copy) {
    dependsOn parseCurrent
    into p.previousFile.parentFile
    from { findProperty('initialCatalog') ? file(findProperty('initialCatalog')) : [] }
    rename { p.previousFile.name }
    onlyIf { bootstrap && !!findProperty('initialCatalog') }
    doFirst {
        if (!file(findProperty('initialCatalog')).isFile()) throw new GradleException('initialCatalog is not a readable file.')
    }
}
def validation = []
def inputs = [p.previousSheets,p.previousFile,new File(p.workDir,'input/datasheet.xtf'),new File(p.root,'shared/data/offices.xtf')]
if (bootstrap) inputs.addAll(p.bootstrapFiles)
inputs.eachWithIndex { f,i ->
    validation << tasks.register('validatePublicationInput'+i,project.buildscript.classLoader.loadClass('ch.so.agi.gretl.tasks.IliValidator')) {
        dependsOn downloads,copyInitial
        dataFiles f
        modelDirectories System.getenv('DATENPORTAL_MODELS_DIR') ?: new File(p.root,'shared/models').path
        logFile new File(p.workDir,'input-validation-'+i+'.log')
        onlyIf { f.isFile() }
    }
}
tasks.register('validatePublicationInputs') { dependsOn validation }
// Always archive a truthful phase report, including failures in a dependency.
gradle.buildFinished { result ->
    if (report.pointerAttempted && report.publication != 'accepted') {
        try {
            def response = project.ext.readPublicationPointer()
            if (response.status == 200) {
                def actual = validateManifest(new JsonSlurper().parseText(response.body))
                report.publication = actual == p.nextManifest ? 'accepted' : 'not-published'
            } else report.publication = 'unknown'
        } catch (Exception ignored) { report.publication = 'unknown' }
    }
    if (report.publication == 'accepted') report.mode='accepted'
    if (result.failure) report.failed=true
    project.ext.writePublicationReport()
}
