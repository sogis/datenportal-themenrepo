// Ein mit «apply from» geladenes Skript hat einen eigenen Skript-Klassenpfad.
// Wir übernehmen die bereits aufgelösten Plugins des Projekts, damit die GRETL-
// und Download-Taskklassen auch hier verfügbar sind. So braucht dieses Skript
// weder eigene Plugin-Versionen noch eine zusätzliche Abhängigkeitsauflösung.
buildscript { dependencies { classpath files(project.buildscript.configurations.classpath) } }

import ch.so.agi.gretl.tasks.*
import de.undercouch.gradle.tasks.download.Download
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.time.Duration
import java.time.LocalDate
import java.time.ZoneId

// Pfade und Konfiguration stehen vor dem Tasklauf fest. Die Root-Initialisierung
// startet im Themenrepo, ein Organisationsjob dagegen eine Verzeichnisebene tiefer.
// Sämtliche Arbeitsdaten liegen unter build/publication: Jeder Lauf erhält eine
// frische DuckDB; nur der über current.json bezeichnete Stand wird weitergeführt.
def ctx = project.ext.datenportalContext
def bootstrap = project.ext.has('datenportalBootstrap') && project.ext.datenportalBootstrap
def root = bootstrap ? project.projectDir : project.projectDir.parentFile
def shared = new File(root, 'shared')
def work = new File(buildDir, 'publication')
def outputs = new File(work, 'outputs')
def input = new File(work, 'input')
def release = new File(work, 'release')
def rdf = new File(outputs, 'opendata.rdf')
def db = new File(work, 'publication.duckdb')
def models = System.getenv('DATENPORTAL_MODELS_DIR') ?: new File(shared, 'models').path
def sheetModel = 'SO_AGI_DataCatalog_Datasheet_20260523'
def catalogModel = 'SO_AGI_DataCatalog_PublishedCatalog_20260602'
def officeModel = 'SO_AGI_DataCatalog_Base_20260529'
def publish = (findProperty('s3Publish') ?: 'false').toString() == 'true'
def reload = (findProperty('reloadPortal') ?: 'false').toString() == 'true'
def manifestUrl = (findProperty('publicationManifestUrl') ?: '').toString().trim()
def localInput = manifestUrl.startsWith('file:')
// Eindeutige XTF-Dateinamen erlauben, beide Kandidaten vollständig hochzuladen,
// während current.json noch auf das bisherige Dateipaar zeigt. CSV/XLSX/Parquet
// behalten ihre festen Namen und sind von dieser gemeinsamen Umschaltung ausgenommen.
def releaseId = UUID.randomUUID().toString()
def initialCatalog = findProperty('initialCatalog') ? file(findProperty('initialCatalog')) : null
def selectedSheet = new File(outputs, 'metadata/' + (ctx.selectedDatasetDef?.metadataFile?.name ?: 'datasheet.xtf'))
def config = new Properties()
new File(shared, 'publication.properties').withReader('UTF-8') { config.load(it) }
def json = { File f -> new JsonSlurper().parse(f) }
def writeJson = { File f, value -> f.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n' }
// sqlParameters ersetzt Text in SQL-Dateien. Deshalb müssen auch lokale Dateipfade
// als SQL-Zeichenketten maskiert werden, etwa wenn ein Pfad ein Apostroph enthält.
// Die eigentlichen Laufwerte stehen in JSON; ihre fachliche Auswertung bleibt SQL.
def quote = { value -> "'" + value.toString().replace("'", "''") + "'" }
def sqlPaths = [parameters_file:quote(new File(work,'parameters.json')),
    mappings_file:quote(new File(work,'mappings.json')),control_file:quote(new File(work,'delivery.json')),
    result_file:quote(new File(work,'result.json'))]
// Das Manifest ist der gemeinsame Vertrag mit Portal und Editor. Die Bindung der
// Dateinamen an releaseId schliesst fremde URLs und Pfadwechsel aus. catalog:null
// ist ein gültiger Erststand ohne technische Lieferdaten; ein fehlendes Feld oder
// ein beschädigter Verweis darf dagegen nicht als leerer Katalog behandelt werden.
def manifest = { value ->
    if (!(value instanceof Map) || value.schemaVersion != 1 || !(value.releaseId instanceof String)
        || !(value.releaseId ==~ /[A-Za-z0-9][A-Za-z0-9_-]{0,127}/)
        || value.datasheets != "datasheets-${value.releaseId}.xtf" || !value.containsKey('catalog')
        || !(value.catalog == null || value.catalog == "published-catalog-${value.releaseId}.xtf"))
        throw new GradleException('Invalid publication manifest (schemaVersion, releaseId or filenames).')
    value
}
// Provider lesen Dateien erst, wenn ein nachgelagerter Task sie benötigt. Während
// Gradle den Ablauf konfiguriert, existieren die Downloads und SQL-Ergebnisse noch
// nicht. dependsOn sichert jeweils die Erzeugung vor dem Lesen. current liest dabei
// immer dieselbe lokale Downloadkopie; weitere S3-Abfragen zur Kontrolle ersetzen
// diese Eingangsgrundlage nicht. delivery/result sind nur Arbeitsartefakte des Laufs.
def current = providers.provider { bootstrap ? [:] : manifest(json(new File(input,'current.json'))) }
def delivery = providers.provider { json(new File(work,'delivery.json'))[0] }
def result = providers.provider { json(new File(work,'result.json'))[0] }
def nextManifest = providers.provider { manifest(json(new File(outputs,'current.json'))) }
def catalogInput = providers.provider { bootstrap ? initialCatalog != null : current.get().catalog != null }
def report = [mode:'preview', dataset:ctx.selectedDataset, issue:ctx.seriesId, comment:ctx.comment,
    metadataFileName:ctx.metadataFileName,dataFileName:ctx.dataFileName,summaryLines:ctx.summaryLines,
    publicationMode:ctx.publicationMode,releaseId:releaseId,git:'not-requested',publication:'not-published',reload:'not-requested',sourceFiles:[],
    opendata:[status:'not-published',datasetCount:null,url:null]]
// Die Git-Anbindung braucht dieselben Pfade und ergänzt denselben Ergebnisbericht.
// Fachliche Zwischenergebnisse werden ausschliesslich über die SQL-Arbeitsdateien
// gelesen. Die separate Schreibfreigabe verhindert Git-Änderungen bei Vorschauen
// und bei der administrativen Initialisierung, auch wenn gitWriteBack gesetzt ist.
project.ext.publicationWorkDir = work
project.ext.publicationRoot = root
project.ext.publicationReport = report
project.ext.publicationWriteEnabled = publish && !bootstrap
def writeReport = { outputs.mkdirs(); writeJson(new File(outputs,'report.json'),report) }
project.ext.writePublicationReport = writeReport

// Für die Initialisierung müssen wir 404 von Zugriffs- und Serverfehlern unterscheiden.
// Nach einer unklaren PUT-Antwort müssen wir zudem prüfen können, ob der neue Verweis
// trotz Fehlermeldung bereits gilt. Dafür liefert diese kleine HTTP-Hilfe Status und
// Inhalt zusammen. Reguläre Dateiübertragungen erledigen die unten sichtbaren Tasks.
// Die Kontrollabfrage fordert einen frischen Stand an; ein alter Cacheinhalt könnte
// sonst eine erfolgte Veröffentlichung als fehlgeschlagen erscheinen lassen.
def readPointer = {
    def uri = URI.create(manifestUrl)
    if (localInput) {
        def f = new File(uri)
        return f.isFile() ? [status:200,body:f.getText('UTF-8')] : [status:404,body:'']
    }
    def request = HttpRequest.newBuilder(uri).timeout(Duration.ofSeconds(30))
        .header('Cache-Control','no-cache, no-store').GET().build()
    def response = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(10)).build()
        .send(request,HttpResponse.BodyHandlers.ofString())
    [status:response.statusCode(),body:response.body()]
}
// Nur zur Klärung eines bereits versuchten RDF-Uploads: Auch eine verlorene
// PUT-Antwort kann einen erfolgreichen Upload bedeuten. Ein frischer Bytevergleich
// unterscheidet diesen Fall von einem alten Export. Ist das Ziel nicht lesbar,
// bleibt der Ausgang unbekannt. Der normale Download bleibt ein eigener Task.
def confirmRdf = {
    def request = HttpRequest.newBuilder(URI.create(report.opendata.url)).timeout(Duration.ofSeconds(30))
        .header('Cache-Control','no-cache, no-store').header('Accept-Encoding','identity').GET().build()
    def response = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(10)).build()
        .send(request,HttpResponse.BodyHandlers.ofByteArray())
    response.statusCode()==200 ? (response.body()==rdf.bytes ? 'accepted' : 'not-published') :
        (response.statusCode()==404 ? 'not-published' : 'unknown')
}

tasks.register('preparePublicationWorkspace') {
    doLast {
        if (!bootstrap) project.ext.validateDatenportalExecution()
        // Das Arbeitsverzeichnis wird anschliessend gelöscht. Lieferdateien darin
        // würden dabei verloren gehen; diese Fehlkonfiguration muss vorher auffallen.
        [ctx.metadataFile,ctx.dataFile,initialCatalog].findAll { it }.each { source ->
            if (file(source).canonicalPath.startsWith(work.canonicalPath+File.separator))
                throw new GradleException('Delivery inputs must be outside build/publication.')
        }
        if (!manifestUrl) throw new GradleException('publicationManifestUrl is required.')
        def uri = URI.create(manifestUrl)
        report.opendata.url = uri.resolve('opendata.rdf').toString()
        if (!(uri.scheme in ['http','https']) && !(localInput && !publish))
            throw new GradleException('Manifest must use HTTP(S); file inputs are only allowed for offline previews.')
        if (uri.userInfo || uri.query || uri.fragment) throw new GradleException('Manifest URL must not contain credentials, query or fragment.')
        if (!localInput && gradle.startParameter.offline) throw new GradleException('HTTP downloads require omitting --offline; offline dependency resolution remains in use.')
        if (initialCatalog && (!bootstrap || !initialCatalog.isFile()))
            throw new GradleException('initialCatalog must be a readable file and is only allowed during initialization.')
        delete work
        input.mkdirs(); outputs.mkdirs(); selectedSheet.parentFile.mkdirs()
        // Das Annahmedatum wird genau einmal bestimmt. Auch ein Lauf über Mitternacht
        // soll für Serie, Ausgabe und Katalog denselben Schweizer Kalendertag verwenden.
        // Die JSON-Dateien übergeben Werte und URI-Zuordnungen an SQL, ohne fachliche
        // Abfragen oder Typentscheidungen im Groovy-Code nachzubilden.
        report.acceptedDate = LocalDate.now(ZoneId.of('Europe/Zurich')).toString()
        writeJson(new File(work,'parameters.json'), [[dataset:ctx.selectedDataset,issue:ctx.seriesId,
            is_series:ctx.datasetIsSeries,has_data:!!ctx.dataFile,today:report.acceptedDate,bootstrap:bootstrap,
            replace_metadata:!!ctx.metadataFile || ctx.publicationMode=='repository-metadata',
            csv_file:new File(input,'data.csv').absolutePath,
            base_uri:findProperty('catalogBaseUri') ?: config.getProperty('baseUri'),
            download_base:findProperty('catalogDownloadBase') ?: config.getProperty('downloadBase'),
            publisher:config.getProperty('publisher'),catalog_title:config.getProperty('title'),
            catalog_description:config.getProperty('description'),dataset_path:config.getProperty('datasetPath'),
            series_path:config.getProperty('seriesPath'),issue_path:config.getProperty('issuePath')]])
        writeJson(new File(work,'mappings.json'), config.stringPropertyNames().sort().collect { [key:it,value:config.getProperty(it)] })
        if (bootstrap) {
            // Nur ein ausdrückliches «nicht vorhanden» erlaubt den Erstaufbau.
            // Ein nicht erreichbarer oder geschützter Bestand ist kein leerer Bestand.
            def response = readPointer()
            if (response.status != 404) throw new GradleException("Initialization requires an absent current.json (HTTP 404); got ${response.status}.")
        }
    }
}

// Der Verweis wird einmal heruntergeladen und danach lokal ausgewertet. Er darf
// weder aus Gradles vorherigem Task-Ergebnis noch aus einem HTTP-Cache stammen.
// tempAndMove verhindert, dass ein abgebrochener Download als fertige Datei vorliegt.
// Offline-Vorschauen verwenden für denselben Ablauf eine lokale Kopie mit Copy.
tasks.register('downloadCurrent', Download) {
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }
    dependsOn 'preparePublicationWorkspace'
    src manifestUrl ?: 'http://invalid.invalid/current.json'
    dest new File(input,'current.json')
    setOnlyIf { !bootstrap && !localInput }
}
tasks.register('copyCurrentManifest', Copy) {
    dependsOn 'preparePublicationWorkspace'
    from { localInput ? new File(URI.create(manifestUrl)) : [] }; into input; rename { 'current.json' }
    onlyIf { !bootstrap && localInput }
}
tasks.register('readCurrentManifest') {
    dependsOn 'downloadCurrent','copyCurrentManifest'
    doLast { if (!bootstrap) report.sourceReleaseId = current.get().releaseId }
}
tasks.register('downloadPreviousDatasheets', Download) {
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }
    dependsOn 'readCurrentManifest'
    src { current.get().datasheets ? URI.create(manifestUrl).resolve(current.get().datasheets).toString() : [] }
    dest new File(input,'previous-datasheets.xtf')
    setOnlyIf { !bootstrap && !localInput }
}
tasks.register('downloadPreviousCatalog', Download) {
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }
    dependsOn 'readCurrentManifest'
    src { current.get().catalog ? URI.create(manifestUrl).resolve(current.get().catalog).toString() : [] }
    dest new File(input,'previous-catalog.xtf')
    setOnlyIf { !bootstrap && !localInput && catalogInput.get() }
}
tasks.register('copyPreviousDatasheets', Copy) {
    dependsOn 'readCurrentManifest'
    from { localInput ? new File(URI.create(manifestUrl)).parentFile : [] }
    include { it.relativePath.pathString == current.get().datasheets }
    into input; rename { 'previous-datasheets.xtf' }
    onlyIf { !bootstrap && localInput }
}
tasks.register('copyPreviousCatalog', Copy) {
    dependsOn 'readCurrentManifest'
    if (bootstrap) from(initialCatalog ?: [])
    else {
        from { localInput ? new File(URI.create(manifestUrl)).parentFile : [] }
        include { it.relativePath.pathString == current.get().catalog }
    }
    into input; rename { 'previous-catalog.xtf' }
    onlyIf { (bootstrap || localInput) && catalogInput.get() }
}
tasks.register('copyPublicationInputs', Copy) {
    dependsOn 'downloadPreviousDatasheets','downloadPreviousCatalog','copyPreviousDatasheets','copyPreviousCatalog'
    into input
    // Das Repository-Datenblatt wird auch bei einer reinen CSV-Lieferung bereitgestellt.
    // Ob es übernommen wird, entscheidet SQL: Bestehende Themen verwenden grundsätzlich
    // die angenommene Sammlung; für ein dort neues Thema dient es als Metadatenquelle.
    if (!bootstrap) from(ctx.metadataFile ? file(ctx.metadataFile) : (ctx.selectedDatasetDef?.metadataFile ?: [])) { rename { 'datasheet.xtf' } }
    if (ctx.dataFile) from(file(ctx.dataFile)) { rename { 'data.csv' } }
}

tasks.register('validatePreviousDatasheets', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'copyPublicationInputs'; dataFiles new File(input,'previous-datasheets.xtf'); onlyIf { !bootstrap }
}
tasks.register('validatePreviousCatalog', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'validatePreviousDatasheets'; dataFiles new File(input,'previous-catalog.xtf'); onlyIf { catalogInput.get() }
}
tasks.register('validateIncomingSheet', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'validatePreviousCatalog'; dataFiles new File(input,'datasheet.xtf'); onlyIf { !bootstrap }
}
tasks.register('validateOffices', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'validateIncomingSheet'; dataFiles new File(shared,'data/offices.xtf')
}
// Alle folgenden Datenbankzugriffe sind über dependsOn sequenziell verbunden, weil
// sie dieselbe DuckDB verwenden. Getrennte Schemas halten Eingangsstand und Ergebnis
// auseinander. Basket- und Transfer-ID-Spalten erhalten die für den XTF-Export
// nötigen Zuordnungen; coalesceJson legt die von den SQL-Dateien erwartete Abbildung
// verschachtelter Strukturen fest. Änderungen daran müssen mit SQL abgestimmt werden.
// Die Tasks laufen auch bei unveränderten Eingabepfaden erneut, da die Arbeitsdatenbank
// am Anfang jedes Laufs neu angelegt wird.
tasks.register('createPublicationSchema_repository', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'validateOffices'; schema 'repository'; modelNames sheetModel
}
tasks.register('createPublicationSchema_incoming', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_repository'; schema 'incoming'; modelNames sheetModel
}
tasks.register('createPublicationSchema_sheets', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_incoming'; schema 'sheets'; modelNames sheetModel
}
tasks.register('createPublicationSchema_offices', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_sheets'; schema 'offices'; modelNames officeModel
}
tasks.register('createPublicationSchema_previous', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_offices'; schema 'previous'; modelNames catalogModel
}
tasks.register('createPublicationSchema_candidate', Ili2duckdbImportSchema) {
    databaseFile db; modelDirectories models
    createBasketCol.set(true); createTidCol.set(true); coalesceJson.set(true)
    getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_previous'; schema 'candidate'; modelNames catalogModel
}
tasks.register('importPreviousSheets', Ili2duckdbImport) {
    databaseFile db; modelDirectories models; getOutputs().upToDateWhen { false }
    dependsOn 'createPublicationSchema_candidate'; schema 'repository'; modelNames sheetModel
    transferFiles new File(input,'previous-datasheets.xtf'); onlyIf { !bootstrap }
}
// Nur die Initialisierung sammelt alle Repository-Datenblätter. Sie ergänzt hier
// ihre Eingangs-Tasks; SQL, Exporte und Veröffentlichung bleiben derselbe Ablauf.
if (bootstrap) apply from: new File(shared,'gradle/datenportal-initialize.gradle')
tasks.register('importIncomingSheet', Ili2duckdbImport) {
    databaseFile db; modelDirectories models; getOutputs().upToDateWhen { false }
    dependsOn bootstrap ? 'importInitialSheets' : 'importPreviousSheets'
    schema 'incoming'; modelNames sheetModel; transferFiles new File(input,'datasheet.xtf'); onlyIf { !bootstrap }
}
tasks.register('importOffices', Ili2duckdbImport) {
    databaseFile db; modelDirectories models; getOutputs().upToDateWhen { false }
    dependsOn 'importIncomingSheet'; schema 'offices'; modelNames officeModel; transferFiles new File(shared,'data/offices.xtf')
}
tasks.register('importPreviousCatalog', Ili2duckdbImport) {
    databaseFile db; modelDirectories models; getOutputs().upToDateWhen { false }
    dependsOn 'importOffices'; schema 'previous'; modelNames catalogModel
    transferFiles new File(input,'previous-catalog.xtf'); onlyIf { catalogInput.get() }
}
tasks.register('mergeDatasheets', DuckDbSqlExecutor) {
    database db; installExtensions false; sqlParameters sqlPaths; getOutputs().upToDateWhen { false }
    dependsOn 'importPreviousCatalog'
    sqlFiles new File(shared,'sql/publication/parameters.sql'),new File(shared,'sql/publication/merge-datasheets.sql'),new File(shared,'sql/publication/delivery.sql')
}
tasks.register('validateDeliveredCsv', CsvValidator) {
    dependsOn 'mergeDatasheets'
    dataFiles new File(input,'data.csv'); modelDirectories models; logFile new File(work,'csv-validation.log')
    modelNames.set(providers.provider { delivery.get().model ? [delivery.get().model.toString()] : [] })
    onlyIf { ctx.dataFile && delivery.get().model }
}
tasks.register('prepareCsvConversion') {
    dependsOn 'validateDeliveredCsv'; onlyIf { !!ctx.dataFile }
    // SQL hat Modell, Attribute, Prüfungen und Konvertierung bereits aus den wirksamen
    // Metadaten bestimmt. GRETL erwartet für den nächsten Schritt eine SQL-Datei;
    // diese Brücke schreibt den erzeugten Text unverändert heraus. Dadurch gibt es
    // keine zweite Implementierung der Typ- und Auswahlregeln in Groovy.
    doLast { new File(work,'convert.sql').text = delivery.get().sql + '\n' }
}
tasks.register('convertDeliveredCsv', DuckDbSqlExecutor) {
    database db; installExtensions false; getOutputs().upToDateWhen { false }
    dependsOn 'prepareCsvConversion'; onlyIf { !!ctx.dataFile }
    // Zunächst alles als Text lesen, damit DuckDB keine Typen errät und beispielsweise
    // führende Nullen entfernt. Erst convert.sql typisiert anhand des Datenblatts;
    // XLSX und Parquet werden anschliessend aus derselben typisierten Tabelle erzeugt.
    sources { csv('csv_input') { file new File(input,'data.csv'); table='records'; header=true; allVarchar=true } }
    sqlFiles new File(work,'convert.sql')
    exports {
        parquet('parquet') { query='SELECT * FROM data.records'; file new File(work,'delivery.parquet') }
        xlsx('xlsx') { query='SELECT * FROM data.records'; file new File(work,'delivery.xlsx'); sheet='Daten' }
    }
}
tasks.register('copyDataExports', Copy) {
    dependsOn 'convertDeliveredCsv'; into outputs; onlyIf { !!ctx.dataFile }
    from(new File(input,'data.csv')) { rename { delivery.get().csv } }
    from(new File(work,'delivery.xlsx')) { rename { delivery.get().xlsx } }
    from(new File(work,'delivery.parquet')) { rename { delivery.get().parquet } }
}
tasks.register('assemblePublication', DuckDbSqlExecutor) {
    database db; installExtensions false; sqlParameters sqlPaths; getOutputs().upToDateWhen { false }
    dependsOn 'copyDataExports'
    sqlFiles new File(shared,'sql/publication/assemble.sql'),new File(shared,'sql/publication/result.sql')
}
// Kennungen und Beziehungen wurden in SQL gesetzt. Die Exporte werden direkt
// validiert und weiterverwendet; Präfixe und Formatierung verantwortet der Exporter.
// Der Einzelexport ist für das Git-Rückschreiben bestimmt, die Gesamtdateien für S3.
tasks.register('exportDatasheets', Ili2duckdbExport) {
    databaseFile db; modelDirectories models
    dependsOn 'assemblePublication'; schema 'sheets'; modelNames sheetModel; dataFiles new File(outputs,'datasheets.xtf')
}
tasks.register('exportSelectedDatasheet', Ili2duckdbExport) {
    databaseFile db; modelDirectories models
    dependsOn 'exportDatasheets'; schema 'sheets'; modelNames sheetModel
    dataFiles selectedSheet; datasetNames(ctx.selectedDataset ?: 'unused'); onlyIf { !bootstrap }
}
tasks.register('exportPublishedCatalog', Ili2duckdbExport) {
    databaseFile db; modelDirectories models
    dependsOn 'exportSelectedDatasheet'; schema 'candidate'; modelNames catalogModel
    dataFiles new File(outputs,'published-catalog.xtf'); onlyIf { result.get().catalogPresent }
}
tasks.register('validatePublicationCollection', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'exportPublishedCatalog'; dataFiles new File(outputs,'datasheets.xtf')
}
tasks.register('validatePublicationSelected', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'validatePublicationCollection'; dataFiles selectedSheet; onlyIf { !bootstrap }
}
tasks.register('validatePublicationCatalog', IliValidator) {
    modelDirectories models; logFile new File(work,name+'.log')
    dependsOn 'validatePublicationSelected'; dataFiles new File(outputs,'published-catalog.xtf'); onlyIf { result.get().catalogPresent }
}
// Der Katalog wurde bereits mit ilivalidator geprüft. Ein katalogloser Erststand
// erhält ausdrücklich ein technisches Leerdokument. Ein unerwartet fehlender
// Katalog darf dagegen nicht als leerer RDF-Export weiterlaufen: Copy allein
// würde eine fehlende Quelldatei ohne Fehler überspringen; XslTransformer verlangt
// danach die konkrete Eingabedatei. Die getrennten Copy-Tasks verhindern ausserdem,
// dass Gradle result.json schon beim Ermitteln der Task-Abhängigkeiten lesen muss.
tasks.register('copyOpendataInput', Copy) {
    dependsOn 'validatePublicationCatalog'
    from new File(outputs,'published-catalog.xtf')
    into new File(work,'opendata/input'); rename { 'opendata.xml' }
    onlyIf { result.get().catalogPresent }
}
tasks.register('copyEmptyOpendataInput', Copy) {
    dependsOn 'copyOpendataInput'
    from new File(shared,'xsl/opendata/empty.xml')
    into new File(work,'opendata/input'); rename { 'opendata.xml' }
    onlyIf { !result.get().catalogPresent }
}
tasks.register('transformOpendata', XslTransformer) {
    dependsOn 'copyEmptyOpendataInput'
    xmlFiles new File(work,'opendata/input/opendata.xml')
    xslFile new File(shared,'xsl/opendata/catalog.xsl')
    outDirectory new File(work,'opendata/generated'); fileExtension 'rdf'
}
tasks.register('validateOpendata', XslTransformer) {
    dependsOn 'transformOpendata'
    xmlFiles new File(work,'opendata/generated/opendata.rdf')
    xslFile new File(shared,'xsl/opendata/validate.xsl')
    outDirectory new File(work,'opendata/validation'); fileExtension 'json'
}
tasks.register('copyOpendataExport', Copy) {
    dependsOn 'validateOpendata'
    from new File(work,'opendata/generated/opendata.rdf'); into outputs
    // Erst die erfolgreiche Prüfung liefert die Anzahl. Groovy liest nur dieses
    // kleine Prüfergebnis; Auswahl und RDF-Abbildung bleiben in SQL bzw. XSLT.
    doLast { report.opendata.datasetCount=json(new File(work,'opendata/validation/opendata.json')).datasetCount }
}
tasks.register('validatePublication') { dependsOn 'copyOpendataExport' }
apply from: new File(shared,'gradle/datenportal-git.gradle')
tasks.register('preparePublication') {
    dependsOn 'createPublicationDiff'
    group='datenportal'
    doLast {
        report.putAll(result.get())
        report.message = report.catalogPresent ? 'Lieferung vorbereitet; noch nicht veröffentlicht.' : 'Datenblätter vorbereitet; noch keine katalogfähigen Daten.'
        writeReport()
    }
}
// preparePublication endet vor den Veröffentlichungsschritten. Die Abhängigkeiten
// sind bewusst so gerichtet, dass ein direkter Vorbereitungsaufruf auch bei gesetzten
// S3-, Git- und Reloadschaltern ausschliesslich lokale Ergebnisse erzeugt.
tasks.register('stagePublication', Copy) {
    dependsOn 'preparePublication'; into release
    from(new File(outputs,'datasheets.xtf')) { rename { "datasheets-${releaseId}.xtf" } }
    from(new File(outputs,'published-catalog.xtf')) { rename { "published-catalog-${releaseId}.xtf" } }
    doLast {
        writeJson(new File(outputs,'current.json'),[schemaVersion:1,releaseId:releaseId,
            datasheets:"datasheets-${releaseId}.xtf",catalog:result.get().catalogPresent ? "published-catalog-${releaseId}.xtf" : null])
    }
}
tasks.register('checkPublicationTarget') {
    dependsOn 'stagePublication'; onlyIf { publish }
    doLast {
        project.ext.requireDatenportalS3()
        if (reload && (!(findProperty('portalReloadUrl') ?: '').toString().trim() || !(findProperty('portalReloadToken') ?: '').toString()))
            throw new GradleException('Requested reload requires portalReloadUrl and portalReloadToken.')
    }
}
tasks.register('uploadDataExports', S3Upload) {
    dependsOn 'checkPublicationTarget'
    sourceFiles fileTree(outputs) { include '*.csv','*.xlsx','*.parquet' }
    onlyIf { publish && !!ctx.dataFile }
}
tasks.register('uploadPublicationFiles', S3Upload) {
    dependsOn 'uploadDataExports'; sourceDir release; contentType 'application/xml'; onlyIf { publish }
    doLast { report.publication='candidates-uploaded'; writeReport() }
}
tasks.register('downloadCandidateDatasheets', Download) {
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }
    dependsOn 'uploadPublicationFiles'
    src { nextManifest.get().datasheets ? URI.create(manifestUrl).resolve(nextManifest.get().datasheets).toString() : [] }
    dest new File(work,'readback/datasheets.xtf'); retries 3; setOnlyIf { publish }
}
tasks.register('downloadCandidateCatalog', Download) {
    overwrite true; tempAndMove true; compress false
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }
    dependsOn 'uploadPublicationFiles'
    src { nextManifest.get().catalog ? URI.create(manifestUrl).resolve(nextManifest.get().catalog).toString() : [] }
    dest new File(work,'readback/catalog.xtf'); retries 3; setOnlyIf { publish && result.get().catalogPresent }
}
tasks.register('verifyPublicationCandidates') {
    dependsOn 'downloadCandidateDatasheets','downloadCandidateCatalog'; onlyIf { publish }
    doLast {
        // Eine erfolgreiche S3-Antwort allein belegt noch nicht, dass Leser die neuen
        // Dateien am konfigurierten öffentlichen Ziel erhalten. Vor Git und Umschaltung
        // vergleichen wir deshalb den öffentlich gelesenen Inhalt bytegenau mit den
        // Uploadkandidaten. Hier geht es um Übertragungstreue, nicht um XML-Formatierung.
        ['datasheets','catalog'].findAll { nextManifest.get()[it]!=null }.each { key ->
            if (new File(release,nextManifest.get()[key]).bytes != new File(work,'readback/'+key+'.xtf').bytes)
                throw new GradleException('Public XTF readback differs: '+key)
        }
    }
}
tasks.named('commitAndPushMetadata') { dependsOn 'verifyPublicationCandidates' }
// Git muss vor der Umschaltung erfolgreich sein. Scheitert der Push, bleibt der
// bisherige S3-Verweis gültig. Scheitert erst die Umschaltung, kann Git bereits das
// neue Datenblatt enthalten; der Bericht hält beide Ergebnisse getrennt fest.
tasks.register('uploadCurrentManifest', S3Upload) {
    dependsOn 'commitAndPushMetadata'; sourceFile new File(outputs,'current.json'); contentType 'application/json'; onlyIf { publish }
    doFirst {
        // Unmittelbar vor dem Schreiben nochmals den Ausgangsstand prüfen. Das erkennt
        // zwischenzeitliche Änderungen, ersetzt aber keine Sperre: Lesen und PUT sind
        // nicht atomar. Jenkins muss den gesamten Lauf organisationsübergreifend sperren.
        def response=readPointer()
        if (bootstrap ? response.status!=404 : response.status!=200 || manifest(new JsonSlurper().parseText(response.body))!=current.get())
            throw new GradleException('Publication baseline changed; current.json was not overwritten.')
        // Bei Verbindungsabbruch kann S3 den PUT bereits angenommen haben. Deshalb ab
        // hier «unknown» statt «not-published» melden, bis das Rücklesen Klarheit schafft.
        report.pointerAttempted=true; report.publication='unknown'; writeReport()
    }
    doLast {
        def response=readPointer()
        if (response.status!=200 || manifest(new JsonSlurper().parseText(response.body))!=nextManifest.get())
            throw new GradleException('Could not confirm current.json publication.')
        report.publication='accepted'; report.mode='accepted'; writeReport()
    }
}
// opendata.rdf folgt erst nach der bestätigten XTF-Umschaltung. Die feste Datei
// gehört deshalb nicht ins vorab hochgeladene release-Verzeichnis. Ein RDF-Fehler
// nimmt den XTF-Stand nicht zurück, verhindert aber den nachfolgenden Portal-Reload.
tasks.register('uploadOpendata', S3Upload) {
    dependsOn 'uploadCurrentManifest'; sourceFile rdf; contentType 'application/rdf+xml'; onlyIf { publish }
    doFirst { report.opendata.attempted=true; report.opendata.status='unknown'; writeReport() }
}
tasks.register('downloadOpendata', Download) {
    dependsOn 'uploadOpendata'
    src { report.opendata.url }; dest new File(work,'readback/opendata.rdf')
    overwrite true; tempAndMove true; compress false; retries 3
    header 'Accept-Encoding','identity'; header 'Cache-Control','no-cache, no-store'
    getOutputs().upToDateWhen { false }; setOnlyIf { publish }
}
tasks.register('verifyOpendata') {
    dependsOn 'downloadOpendata'; onlyIf { publish }
    doLast {
        if (rdf.bytes != new File(work,'readback/opendata.rdf').bytes)
            throw new GradleException('RDF-Export: Öffentliches Rücklesen stimmt nicht mit opendata.rdf überein.')
        report.opendata.status='accepted'; writeReport()
    }
}
// Die ausdrücklich benannten Upload-Tasks verwenden dieselbe S3-Konfiguration.
// checkPublicationTarget prüft sie einmal vor dem ersten Upload. Leere Platzhalter
// erlauben, den Taskablauf auch ohne Credentials für eine Vorschau zu konfigurieren.
// Diese Schleife setzt nur gemeinsame Eigenschaften; sie erzeugt keine neuen Tasks.
[ tasks.named('uploadDataExports'), tasks.named('uploadPublicationFiles'), tasks.named('uploadCurrentManifest'), tasks.named('uploadOpendata') ].each { upload ->
    upload.configure {
        def s3=project.ext.datenportalS3
        endpoint=s3.endpoint ?: ''; region=s3.region ?: ''; bucketName=s3.bucketName ?: ''
        accessKey=s3.accessKey ?: ''; secretKey=s3.secretKey ?: ''; acl=s3.acl
        getOutputs().upToDateWhen { false }
    }
}
tasks.register('reloadPortal', Curl) {
    dependsOn 'verifyOpendata'
    serverUrl (findProperty('portalReloadUrl') ?: 'http://invalid.invalid/admin/catalog/reload').toString()
    method 'POST'; expectedStatusCode 200
    headers(['X-Reload-Token':(findProperty('portalReloadToken') ?: '').toString()])
    outputFile new File(outputs,'reload-response.json'); onlyIf { publish && reload }
    // Der Reload folgt erst nach bestätigter S3-Übernahme. Bei einem HTTP- oder
    // Anwendungsfehler bleibt die Veröffentlichung angenommen; nur der Portal-Reload
    // ist fehlgeschlagen. HTTP 200 genügt nicht, die Antwort muss success bestätigen.
    doFirst { report.reload='failed'; writeReport() }
    doLast {
        if (json(new File(outputs,'reload-response.json')).success!=true) throw new GradleException('Portal did not confirm successful reload.')
        report.reload='succeeded'; writeReport()
    }
}
tasks.register('publishToDatenportal') { dependsOn 'reloadPortal'; group='datenportal' }

// Ein Fehler in einer Abhängigkeit verhindert nachgelagerte doLast-Aktionen. Der
// Abschlussbericht wird deshalb am Buildende auch im Fehlerfall geschrieben.
// Wurde ein PUT versucht, klärt erneutes Rücklesen eine verlorene Antwort soweit
// möglich. Bleibt das Ziel unerreichbar oder ungültig, bleibt der Status «unknown».
// Ein bestätigter S3-Stand bleibt auch bei einem späteren Reloadfehler «accepted»;
// der Bericht dient der Diagnose und wird nie als Eingang des nächsten Laufs gelesen.
gradle.buildFinished { outcome ->
    if (report.pointerAttempted && report.publication!='accepted') {
        try {
            def response=readPointer()
            report.publication=response.status==200 ?
                (manifest(new JsonSlurper().parseText(response.body))==nextManifest.get() ? 'accepted' : 'not-published') : 'unknown'
        } catch (Exception ignored) { report.publication='unknown' }
    }
    if (report.publication=='accepted') report.mode='accepted'
    if (report.opendata.attempted && report.opendata.status!='accepted') {
        try { report.opendata.status=confirmRdf() }
        catch (Exception ignored) { report.opendata.status='unknown' }
    }
    if (outcome.failure) report.failed=true
    writeReport()
}
