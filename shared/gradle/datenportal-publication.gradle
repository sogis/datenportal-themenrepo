// ili2duckdb generates random namespace prefixes. Normalize serialization, not metadata content.
def normalizeExports = tasks.register('normalizePublicationExports') {
    dependsOn exportCatalog
    doLast {
        [new File(outputs,'datasheets.xtf'), candidateSheet, candidateCatalog].findAll { it.isFile() }.each { source ->
            def factory=javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.namespaceAware=true
            factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl',true)
            def document=factory.newDocumentBuilder().parse(source)
            String ili='http://www.interlis.ch/xtf/2.4/INTERLIS'
            String base='http://www.interlis.ch/xtf/2.4/'+officeModel
            String model=source==candidateCatalog ? catalogModel : sheetModel
            String namespace='http://www.interlis.ch/xtf/2.4/'+model
            def normalize
            normalize = { node ->
                if (node.nodeType==org.w3c.dom.Node.ELEMENT_NODE) {
                    def removals=[]
                    for(int i=0;i<node.attributes.length;i++) {
                        def attribute=node.attributes.item(i)
                        if(attribute.namespaceURI=='http://www.w3.org/2000/xmlns/') removals << attribute
                    }
                    removals.each { node.removeAttributeNode(it) }
                    String prefix=node.namespaceURI==ili ? 'ili:' : node.namespaceURI==base ? 'base:' : ''
                    document.renameNode(node,node.namespaceURI,prefix+node.localName)
                }
                def children=[]
                for(int i=0;i<node.childNodes.length;i++) children << node.childNodes.item(i)
                children.each { child ->
                    if(child.nodeType==org.w3c.dom.Node.TEXT_NODE && child.textContent.trim().isEmpty()) node.removeChild(child)
                    else normalize(child)
                }
            }
            normalize(document.documentElement)
            def transfer=document.documentElement
            transfer.setAttributeNS('http://www.w3.org/2000/xmlns/','xmlns',namespace)
            transfer.setAttributeNS('http://www.w3.org/2000/xmlns/','xmlns:ili',ili)
            transfer.setAttributeNS('http://www.w3.org/2000/xmlns/','xmlns:base',base)
            def modelList=document.getElementsByTagNameNS(ili,'models').item(0)
            def baseModel=document.createElementNS(ili,'ili:model'); baseModel.textContent=officeModel
            modelList.appendChild(baseModel)
            document.getElementsByTagNameNS(ili,'sender').item(0).textContent='datenportal-gretl'
            def section=document.getElementsByTagNameNS(ili,'datasection').item(0)
            for(int i=0;i<section.childNodes.length;i++) {
                def basket=section.childNodes.item(i)
                if(basket.nodeType==org.w3c.dom.Node.ELEMENT_NODE) {
                    String objectId=basket.firstChild?.getAttributeNS(ili,'tid') ?: 'catalog'
                    basket.setAttributeNS(ili,'ili:bid','b_'+MessageDigest.getInstance('SHA-256').digest(objectId.getBytes('UTF-8')).encodeHex().toString().take(24))
                }
            }
            def transformer=javax.xml.transform.TransformerFactory.newInstance().newTransformer()
            transformer.setOutputProperty(javax.xml.transform.OutputKeys.INDENT,'yes')
            transformer.setOutputProperty('{http://xml.apache.org/xslt}indent-amount','2')
            transformer.transform(new javax.xml.transform.dom.DOMSource(document),new javax.xml.transform.stream.StreamResult(source))
        }
    }
}
def validationChain=normalizeExports
['Collection':new File(outputs,'datasheets.xtf'), 'Selected':candidateSheet, 'Catalog':candidateCatalog].each { name, transfer ->
    def preceding=validationChain
    validationChain=tasks.register('validatePublication'+name, taskTypes.IliValidator) {
        dependsOn preceding
        modelDirectories models
        dataFiles transfer
        logFile new File(workDir,'xtf-validation-'+name.toLowerCase()+'.log')
        onlyIf { transfer.isFile() }
    }
}
def validateOutputs=tasks.register('validatePublication') { dependsOn validationChain }
tasks.register('preparePublication') {
    dependsOn validateOutputs
    doLast {
        report.message=report.catalogPresent ? 'Lieferung vorbereitet; noch nicht veröffentlicht.' : 'Datenblätter vorbereitet; noch keine katalogfähigen Daten.'
        new File(outputs,'report.json').text=JsonOutput.prettyPrint(JsonOutput.toJson(report))+'\n'
    }
}
