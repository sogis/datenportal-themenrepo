id: statistikdienst
title: Statistikdienst Datenportal publizieren
description: Lokaler Datenportal-Smoke-Test fuer Statistikdatensaetze.

department:
  id: statistikdienst
  label: Statistikdienst

datasets:
  source:
    type: subdirectories
    path: "."

permissions:
  read:
    - GA_Gretl_Datenportal_Read
  build:
    - GA_Gretl_Datenportal_Statistikdienst

execution:
  type: jenkinsPipeline
  jobName: gretl-datenportal-statistikdienst
  jenkinsfile: Jenkinsfile
  gradleTask: publishToDatenportal
  timeoutMinutes: 30

notifications:
  email:
    mode: disabled
